name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest 러너에는 Android SDK가 이미 설치돼 있음 (ANDROID_HOME)
      - name: Android SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk crmsync.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crmsync-apk
          path: android/crmsync.apk
      # 설치 파일을 apk 브랜치에도 올려둠 (git으로 바로 받을 수 있게)
      - name: Publish APK to apk branch
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/out && cp android/crmsync.apk /tmp/out/ && cd /tmp/out
          git init -q -b apk && git add crmsync.apk
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "apk ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
